<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Example</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <h2>Menu</h2>
        <ul>
            <a href="../../home.html">Home</a>
        </ul>
        <ul>
            <a href="resources.html">Study</a>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">

        <h>are you ready?</h>
        <button onclick="startQuiz()">Start</button>
        <script>
            function startQuiz(){
                let amount= 0;
                let a=prompt("What is 10+9");
                if (a=="21"){
                    amount++;
                }
                let b=prompt("What is best gpu");
                if (b=="1080ti"){
                    amount++;
                }
                if(amount==2){
                    window.location.assign("game.html");
                }
            }
        </script>
    </main>

</body>
</html>
